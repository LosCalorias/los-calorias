[project]
name = "los-calorias-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
no-lines-before = ["third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
