services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loscalorias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loscalorias}
      POSTGRES_DB: ${POSTGRES_DB:-loscalorias}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-loscalorias}:${POSTGRES_PASSWORD:-loscalorias}@db:5432/${POSTGRES_DB:-loscalorias}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
